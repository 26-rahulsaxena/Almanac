# Builds the Android app (an APK) whenever its files change, and puts it on the website at /almanac.apk.
# The signing key comes from two repository secrets: ANDROID_KEYSTORE (base64) and ANDROID_KEYSTORE_PASSWORD.
# To rebuild by hand: Actions tab → Android app → Run workflow.
name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "android-web/**", "capacitor.config.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: android-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npx cap sync android

      # Firebase settings for the app (reminders), from Firebase → Project settings → Your apps → google-services.json.
      - name: Add Firebase settings
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf %s "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          grep -q '"package_name": *"app.almanac.calendar"' android/app/google-services.json || { echo "::error::Add the GOOGLE_SERVICES_JSON secret: the whole google-services.json for the app app.almanac.calendar."; exit 1; }

      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD repository secrets first."
            exit 1
          fi
          # Spaces or line breaks from copy-pasting are dropped; the length helps spot a paste that got cut short.
          key=$(printf %s "$KEYSTORE_BASE64" | tr -d ' \r\n\t')
          printf %s "$key" | base64 -d > "$RUNNER_TEMP/almanac.p12" || { echo "::error::The ANDROID_KEYSTORE secret isn't the whole text of ANDROID_KEYSTORE.txt (got ${#key} characters, expected 4632)."; exit 1; }
          export KEYSTORE_FILE="$RUNNER_TEMP/almanac.p12"
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          # Gradle's download servers sometimes fail; then try once more from a mirror. The wrapper checks the
          # download against distributionSha256Sum, so only the genuine file is used.
          if [ "$status" -ne 0 ] && grep -qE "Server returned HTTP response code: 5|timed out|timeout \(" "$RUNNER_TEMP/gradle.log"; then
            sed -i 's#^distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip#' gradle/wrapper/gradle-wrapper.properties
            ./gradlew assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"
            status=${PIPESTATUS[0]}
          fi
          set -e
          rm "$KEYSTORE_FILE"
          if [ "$status" -ne 0 ]; then
            # The reason goes into the run's summary, which shows without signing in to GitHub.
            reason=$( (grep -A25 "What went wrong" "$RUNNER_TEMP/gradle.log" || tail -40 "$RUNNER_TEMP/gradle.log") | head -45 | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build failed::$reason"
            exit 1
          fi

      # shortcut: the APK is committed into public/ (a few MB per build) so Vercel serves it; move it to file
      # storage if builds get frequent.
      - name: Put it on the website
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk public/almanac.apk
          # The site compares this with the installed app (Settings → App) and tells phones about a new build.
          printf '{ "build": %s }
' "${{ github.run_number }}" > src/lib/android-build.json
          git config user.name "rahulshakaya12310"
          git config user.email "rahulshakaya12310@gmail.com"
          git add public/almanac.apk src/lib/android-build.json
          git commit -m "Android app build ${{ github.run_number }}"
          # --autostash: the build leaves generated files changed, which a plain pull refuses to work around.
          git pull --rebase --autostash || { echo "::error::Couldn't catch up with main before publishing."; exit 1; }
          git push || { echo "::error::GitHub refused the push. Settings → Actions → General → Workflow permissions must allow read and write."; exit 1; }
